name: v2-cfe-probe

# Feasibility probe for automated CFE tariff fetching (Incapsula WAF check).
# Manual trigger only — promoted to a monthly fetch once the probe passes.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run probe
        working-directory: ./v2
        continue-on-error: true
        run: python scripts/cfe_probe.py

      - name: Upload probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cfe-probe
          path: v2/cfe_probe_out/
          retention-days: 14
