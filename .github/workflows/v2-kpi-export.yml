name: v2-kpi-export

# Export of the KPI_Daily hot window to the `data` branch — MANUAL ONLY
# since v193.1 (Sheets retirement, phase 2b). The daily 13:40 UTC schedule
# fed pio06's argia-sync (sync_kpi.py -> daily_production). daily_production
# is now written on the server: by the 14:15 CEST kpi_pg_mirror during the
# shadow period and directly by kpi_eod (ARGIA_KPI_WRITE=pg) after it —
# a sheet copy arriving afterwards would only ever be stale.
# The data branch is a single force-pushed commit — repo history stays clean.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Window size in days"
        required: false
        default: "20"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/requirements.txt

      - name: Install dependencies
        working-directory: ./v2
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export KPI window
        working-directory: ./v2
        env:
          GOOGLE_SHEET_ID_V2: ${{ secrets.GOOGLE_SHEET_ID_V2 }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          PYTHONPATH=. python scripts/kpi_export_csv.py \
            --days "${{ inputs.days || '20' }}" --out kpi_window.csv

      - name: Publish to data branch (single commit, force push)
        run: |
          mkdir -p /tmp/pub
          cp v2/kpi_window.csv /tmp/pub/
          cd /tmp/pub
          git init -b data
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add kpi_window.csv
          git commit -m "kpi window export $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
