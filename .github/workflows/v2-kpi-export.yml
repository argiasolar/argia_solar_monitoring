name: v2-kpi-export

# Daily export of the KPI_Daily hot window to the `data` branch.
# The pio06 reporting server pulls that branch and upserts into PostgreSQL.
# The data branch is a single force-pushed commit — repo history stays clean.

on:
  schedule:
    - cron: "10 7 * * *"   # 07:10 UTC = 01:10 MX, well after the Pi's EOD run
  workflow_dispatch:
    inputs:
      days:
        description: "Window size in days"
        required: false
        default: "20"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/requirements.txt

      - name: Install dependencies
        working-directory: ./v2
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export KPI window
        working-directory: ./v2
        env:
          GOOGLE_SHEET_ID_V2: ${{ secrets.GOOGLE_SHEET_ID_V2 }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          PYTHONPATH=. python scripts/kpi_export_csv.py \
            --days "${{ inputs.days || '20' }}" --out kpi_window.csv

      - name: Publish to data branch (single commit, force push)
        run: |
          mkdir -p /tmp/pub
          cp v2/kpi_window.csv /tmp/pub/
          cd /tmp/pub
          git init -b data
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add kpi_window.csv
          git commit -m "kpi window export $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
