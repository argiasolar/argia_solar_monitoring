name: v2-tests

# Runs on every push/PR that touches v2/ code. v1 changes don't trigger this.
# No secrets needed - unit tests plus a private throwaway PostgreSQL (tests/portal).

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-*.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: v2/requirements.txt

      - name: Install dependencies
        working-directory: ./v2
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # v263: the portal and job end-to-end tests (tests/portal) start a private
      # PostgreSQL from the runner's preinstalled binaries. ARGIA_REQUIRE_PG=1
      # turns "PostgreSQL not found - skipped" into a failure, so they can never
      # silently stop running here.
      - name: Run pytest
        working-directory: ./v2
        env:
          ARGIA_REQUIRE_PG: "1"
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            # coverage ratchet: the total may not drop below the floor. Raise the
            # floor when a gap from docs/TEST_COVERAGE_GAPS.md is closed.
            PYTHONPATH=. pytest -v --tb=short --cov=argia --cov=scripts --cov=server --cov-branch \
              --cov-report=term-missing:skip-covered --cov-fail-under=76
          else
            PYTHONPATH=. pytest -v --tb=short
          fi
