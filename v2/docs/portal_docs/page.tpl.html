<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Monitoring documentation</title>
<style>
:root{--bg:#f4f6f7;--surface:#fff;--ink:#16232b;--muted:#5d6b73;--line:#dde3e7;--accent:#0f6b63;--accent-soft:#e2f0ee;
 --sun:#a8690f;--code:#f1f4f6;--bar:58px;--rail:290px;--shadow:0 1px 2px rgba(20,35,32,.06),0 8px 24px rgba(20,35,32,.06)}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--bar) + 14px)}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.bar{position:sticky;top:0;z-index:20;height:var(--bar);background:var(--surface);border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:14px;padding:0 16px}
.bar img{height:30px;width:auto;display:block}
.bar .ttl{font-weight:600;font-size:14px;color:var(--muted);border-left:1px solid var(--line);padding-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .sp{flex:1}
.bar a.back{font-size:13.5px;white-space:nowrap}
.menu{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg)}
.lang button{font:600 13px/1 inherit;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:7px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);max-width:1320px;margin:0 auto}
.rail{position:sticky;top:var(--bar);align-self:start;height:calc(100vh - var(--bar));overflow-y:auto;padding:22px 16px 40px;border-right:1px solid var(--line)}
.rail input{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:12px}
.rail h2{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.toc a{display:grid;grid-template-columns:26px 1fr;gap:4px;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35;border-left:2px solid transparent}
.toc a .n{font:12px ui-monospace,Consolas,monospace;color:var(--muted)}
.toc a:hover{background:var(--accent-soft)}
.toc a[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent);font-weight:600}
.toc .empty{font-size:13px;color:var(--muted);padding:6px 8px}
main{min-width:0;padding:34px max(16px,min(52px,5vw)) 80px}
.col{max-width:880px}
.hero{padding-bottom:22px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--sun);margin:0 0 10px}
.hero h1{font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0 0 10px}
.hero p{color:var(--muted);margin:0;font-size:17px}
.sec{padding-top:40px}
.sec .num{font:12.5px ui-monospace,Consolas,monospace;color:var(--accent);margin:0 0 6px}
.sec h2{font-size:27px;line-height:1.2;margin:0 0 14px}
.sec h3{font-size:19px;margin:28px 0 8px}
.sec p,.sec li{max-width:74ch}
.sec ul,.sec ol{padding-left:22px;display:grid;gap:5px}
pre.formula{background:var(--code);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;
 font:13.5px/1.55 ui-monospace,"Cascadia Mono",Consolas,monospace;overflow-x:auto;white-space:pre;margin:10px 0 18px}
.tw{overflow-x:auto;margin:6px 0 20px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--bg);padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
figure{margin:8px 0 24px}
figure .zoom{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);cursor:zoom-in}
figure img{display:block;width:100%;height:auto}
figcaption{font-size:13.5px;color:var(--muted);margin-top:8px}
mark{background:#fde9a8;padding:0 1px}
.foot{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,14,13,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.lb button{position:absolute;top:12px;right:12px;background:#fff;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.scrim{display:none}
@media(max-width:920px){
 .shell{display:block}.menu{display:inline-block}.bar .ttl,.bar a.back{display:none}
 .rail{position:fixed;z-index:40;top:0;left:0;bottom:0;height:auto;width:min(330px,88vw);background:#fff;transform:translateX(-102%);transition:transform .2s}
 body.open .rail{transform:none}body.open .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(8,14,13,.45)}
 main{padding:24px 16px 64px}.sec h2{font-size:23px}
 .bar{gap:10px;padding:0 10px}.bar img{height:24px}.menu #menu-t{display:none}.lang button{padding:6px 9px}
}
@media print{.bar,.rail,.scrim{display:none}.shell{display:block}main{padding:0}}
</style>
</head>
<body>
<header class="bar">
 <button type="button" class="menu" id="menu" aria-controls="rail" aria-expanded="false">&#9776; <span id="menu-t">Contents</span></button>
 <a href="/" title="ARGIA"><img src="{{LOGO}}" alt="ARGIA"></a>
 <span class="ttl" id="bar-t">Monitoring documentation</span>
 <span class="sp"></span>
 <a class="back" id="back" href="/monitoring/">Back to the portal</a>
 <div class="lang" role="group" aria-label="Language">
  <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="es" aria-pressed="false">ES</button>
 </div>
</header>
<div class="shell">
 <nav class="rail" id="rail" aria-label="Contents">
  <input type="search" id="q" placeholder="Search the contents" aria-label="Search the contents">
  <h2 id="toc-t">Contents</h2>
  <ol class="toc" id="toc"></ol>
 </nav>
 <div class="scrim" id="scrim"></div>
 <main>
  <div class="col">
   <header class="hero" id="top"><p class="eyebrow" id="eb"></p><h1 id="h1"></h1><p id="sub"></p></header>
   <div id="content"></div>
   <footer class="foot"><span id="stamp"></span><a href="#top" id="totop">Back to top</a></footer>
  </div>
 </main>
</div>
<template id="tpl-en">
{{EN}}
</template>
<template id="tpl-es">
{{ES}}
</template>
<script id="docs-data" type="application/json">{{DATA}}</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById("docs-data").textContent), lang="en", content=document.getElementById("content");
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}
function u(){return D.ui[lang];}
function chrome(){var t=u();document.documentElement.lang=lang;document.title=t.title;
 document.getElementById("bar-t").textContent=t.title;document.getElementById("eb").textContent=t.eyebrow;
 document.getElementById("h1").textContent=t.title;document.getElementById("sub").textContent=t.sub;
 document.getElementById("toc-t").textContent=t.contents;document.getElementById("menu-t").textContent=t.menu;
 document.getElementById("q").placeholder=t.search;document.getElementById("q").setAttribute("aria-label",t.search);
 document.getElementById("back").textContent=t.back;document.getElementById("totop").textContent=t.top;
 document.getElementById("stamp").textContent=t.updated+" "+D.stamp;
 document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false");});
 content.querySelectorAll("button.zoom").forEach(function(b){b.setAttribute("aria-label",t.enlarge+": "+b.querySelector("img").alt);});}
function fold(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function toc(){var q=fold(document.getElementById("q").value.trim()),ol=document.getElementById("toc"),h="",n=0;
 D.toc[lang].forEach(function(s){var sec=document.getElementById(s.id),hit=!q||fold(s.k).indexOf(q)>=0||(sec&&fold(sec.textContent).indexOf(q)>=0);
  if(sec)sec.hidden=!hit;if(!hit)return;n++;h+='<li><a href="#'+s.id+'" data-id="'+s.id+'"><span class="n">'+(s.n<10?"0":"")+s.n+"</span><span>"+s.t+"</span></a></li>";});
 ol.innerHTML=n?h:'<li class="empty">'+u().none+"</li>";active();}
function current(){var secs=content.querySelectorAll("section.sec:not([hidden])"),y=window.innerHeight*.3,c=secs[0]?secs[0].id:"";
 for(var i=0;i<secs.length;i++){if(secs[i].getBoundingClientRect().top<=y)c=secs[i].id;else break;}return c;}
function active(){var id=current();document.querySelectorAll("#toc a").forEach(function(a){if(a.dataset.id===id)a.setAttribute("aria-current","true");else a.removeAttribute("aria-current");});}
var tick=false;window.addEventListener("scroll",function(){if(tick)return;tick=true;requestAnimationFrame(function(){tick=false;active();});},{passive:true});
function setLang(next,keep){var at=keep?current():null;lang=D.ui[next]?next:"en";content.innerHTML=document.getElementById("tpl-"+lang).innerHTML;
 store("argia_lang",lang);chrome();toc();if(at){var el=document.getElementById(at);if(el)el.scrollIntoView({block:"start",behavior:"instant"});}}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){if(b.dataset.lang!==lang)setLang(b.dataset.lang,true);});});
document.getElementById("q").addEventListener("input",toc);
var menu=document.getElementById("menu");function drawer(o){document.body.classList.toggle("open",o);menu.setAttribute("aria-expanded",o?"true":"false");}
menu.addEventListener("click",function(){drawer(!document.body.classList.contains("open"));});
document.getElementById("scrim").addEventListener("click",function(){drawer(false);});
document.getElementById("toc").addEventListener("click",function(e){if(e.target.closest("a"))drawer(false);});
var lb=null;function closeLb(){if(lb){lb.remove();lb=null;}}
content.addEventListener("click",function(e){var b=e.target.closest("button.zoom");if(!b)return;closeLb();lb=document.createElement("div");lb.className="lb";
 lb.setAttribute("role","dialog");lb.setAttribute("aria-modal","true");var im=document.createElement("img");im.src=b.dataset.src;im.alt=b.querySelector("img").alt;
 var c=document.createElement("button");c.type="button";c.textContent=u().close;lb.appendChild(im);lb.appendChild(c);lb.addEventListener("click",closeLb);document.body.appendChild(lb);c.focus();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeLb();drawer(false);}});
var saved=store("argia_lang"),nav=(navigator.language||"").slice(0,2).toLowerCase();
setLang(D.ui[saved]?saved:(D.ui[nav]?nav:"en"),false);
function jump(){if(location.hash){var t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView({block:"start",behavior:"instant"});}}
jump();window.addEventListener("load",function(){jump();active();});
active();
})();
</script>
</body>
</html>
