# cpa.argia.com.mx (v296) - ARGIA for CPA: the clean energy site for the
# partner CPA (solar + LED for its tenants), static pages generated every
# 5 minutes by /opt/argia/bundle/cpa_gen.py into its own web root.
# Login: its OWN user file (one shared account, HTTP Basic), like the demo:
# no portal login, no session cookie, no proxy to any ARGIA app.
# Password (never in git): /opt/argia/cpa/cpa.htpasswd, set or change with
#   printf 'demo:%s\n' "$(openssl passwd -apr1)" > /opt/argia/cpa/cpa.htpasswd
#   chown root:www-data /opt/argia/cpa/cpa.htpasswd && chmod 640 /opt/argia/cpa/cpa.htpasswd
# (/opt/argia/cpa is 711: nginx may reach the file, nobody may list the folder)
# Without that file nginx answers 500 - the site stays closed, never open.
server {
    listen 80;
    listen [::]:80;
    server_name cpa.argia.com.mx;
    include /etc/nginx/scripts/acme.conf;
    location / { return 301 https://cpa.argia.com.mx$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cpa.argia.com.mx;
    root /www/hosting/cpa.argia.com.mx/www;
    index index.html;
    charset utf-8;
    charset_types text/css text/plain text/csv application/json text/xml;
    ssl_certificate     /etc/letsencrypt/live/cpa.argia.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpa.argia.com.mx/privkey.pem;
    access_log /var/log/nginx/cpa.argia.com.mx-access.log;
    error_log  /var/log/nginx/cpa.argia.com.mx-error.log notice;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    auth_basic "CPA x ARGIA";
    auth_basic_user_file /opt/argia/cpa/cpa.htpasswd;
    location = /favicon.png { auth_basic off; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
