# cpa.argia.com.mx - BOOTSTRAP vhost (HTTP only) used until the
# Let's Encrypt certificate exists:
#   certbot certonly --webroot -w /www/hosting/vas-server.cz/acme -d cpa.argia.com.mx
# (the box's shared ACME root - acme.conf serves /.well-known/ from there)
# then install cpa.argia.com.mx.conf in its place. (v296)
server {
    listen 80;
    listen [::]:80;
    server_name cpa.argia.com.mx;
    root /www/hosting/cpa.argia.com.mx/www;
    include /etc/nginx/scripts/acme.conf;
    location / { return 503; }
}
