# demo.argia.com.mx (v279) - a SEPARATE site: the portal's Report,
# Monitoring and Map with the same live data under invented names
# (ARGIA SOLAR 1..n, all PPA), generated by /opt/argia/bundle/demo_gen.py
# into its own web root.
# Login: its OWN user file (one shared account, HTTP Basic). It has
# nothing to do with the portal login: no auth_app, no users.db, no
# session cookie, no proxy to any ARGIA app. Portal users cannot sign in
# here and the demo account does not exist on the portal.
# Password (never in git): htpasswd file /opt/argia/demo/demo.htpasswd,
# change with  printf 'demo:%s\n' "$(openssl passwd -apr1)" > /opt/argia/demo/demo.htpasswd
server {
    listen 80;
    listen [::]:80;
    server_name demo.argia.com.mx;
    include /etc/nginx/scripts/acme.conf;
    location / { return 301 https://demo.argia.com.mx$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.argia.com.mx;
    root /www/hosting/demo.argia.com.mx/www;
    index index.html;
    charset utf-8;
    charset_types text/css text/plain text/csv application/json text/xml;
    ssl_certificate     /etc/letsencrypt/live/demo.argia.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.argia.com.mx/privkey.pem;
    access_log /var/log/nginx/demo.argia.com.mx-access.log;
    error_log  /var/log/nginx/demo.argia.com.mx-error.log notice;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    auth_basic "ARGIA demo";
    auth_basic_user_file /opt/argia/demo/demo.htpasswd;
    location = /favicon.png { auth_basic off; try_files $uri =404; }
    location /assets/ { expires 1d; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
