# demo.argia.com.mx - BOOTSTRAP vhost (HTTP only) used until the
# Let's Encrypt certificate exists:
#   certbot certonly --webroot -w /www/hosting/demo.argia.com.mx/www -d demo.argia.com.mx
# then install demo.argia.com.mx.conf in its place. (v279)
server {
    listen 80;
    listen [::]:80;
    server_name demo.argia.com.mx;
    root /www/hosting/demo.argia.com.mx/www;
    include /etc/nginx/scripts/acme.conf;
    location / { return 503; }
}
