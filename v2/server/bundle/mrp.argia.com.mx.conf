# mrp.argia.com.mx (v363) - ARGIA for Grupo MRP: the same platform as
# prologis.argia.com.mx (prologis_app.py), a third instance on 127.0.0.1:8522
# with its own data, users and login under /opt/argia/mrp. Who the client is
# and how the pages are worded comes from the server-only client.json there.
limit_req_zone $binary_remote_addr zone=mrp_login:10m rate=10r/m;
server {
    listen 80;
    listen [::]:80;
    server_name mrp.argia.com.mx;
    include /etc/nginx/scripts/acme.conf;
    location / { return 301 https://mrp.argia.com.mx$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mrp.argia.com.mx;
    ssl_certificate     /etc/letsencrypt/live/mrp.argia.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrp.argia.com.mx/privkey.pem;
    # own folder, rotated by /etc/logrotate.d/argia-mrp and kept 12 months
    access_log /var/log/argia-mrp/access.log;
    error_log  /var/log/argia-mrp/error.log notice;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 52m;
    location = /login {
        limit_req zone=mrp_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8522;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # the product manual (/about) is for invited readers
    # only - HTTP Basic with its own user file, nothing to do with the
    # platform login. A file without users = nobody gets in (401).
    # Add or change a reader (asks for the password twice):
    #   printf '%s:%s\n' NAME "$(openssl passwd -apr1)" >> /opt/argia/mrp_about.htpasswd
    location ~ ^/about/?$ {
        limit_req zone=mrp_login burst=5 nodelay;
        auth_basic "ARGIA product manual";
        auth_basic_user_file /opt/argia/mrp_about.htpasswd;
        proxy_pass http://127.0.0.1:8522;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8522;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
