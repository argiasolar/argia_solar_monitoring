# --- ARGIA reporting: session login (replaces HTTP Basic) ---------------
# Every request is authorised by the auth service on 127.0.0.1:8512,
# which reads the signed session cookie and the same users.db the setup
# app writes.  Basic auth is gone because it has no logout: the browser
# cached the password and re-sent it on the next click.
#
# Rollback: cp nginx-argia_auth.conf /etc/nginx/snippets/argia_auth.conf
#           && nginx -t && systemctl reload nginx
# That file is kept in the repo unchanged for exactly this reason.

add_header Cache-Control "no-cache, must-revalidate" always;

auth_request /_argia_auth;
auth_request_set $argia_user $upstream_http_x_argia_user;

location = /_argia_auth {
    internal;
    proxy_pass http://127.0.0.1:8512/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie $http_cookie;
}

# 401 -> the sign-in page (a real page: no browser dialog, and it can
# send you back where you were). 403 -> signed in, but not for this
# page, so the friendly "no access" body rather than a second prompt.
error_page 401 = @argia_login;
error_page 403 /no-access.html;

location @argia_login {
    return 302 /login?next=$request_uri;
}

# The login service itself must never require a session.
# The sign-in page answers 401 (it IS the wall). error_page 401 above
# would turn that into a redirect back to /login -- an infinite loop
# and a total lockout. nginx only applies error_page to an upstream
# status when proxy_intercept_errors is on; it defaults to off, but a
# lockout is too expensive to leave resting on a default, so the three
# login locations say so explicitly.
location = /login {
    proxy_intercept_errors off;
    auth_request off;
    proxy_pass http://127.0.0.1:8512/login;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /logout {
    proxy_intercept_errors off;
    auth_request off;
    proxy_pass http://127.0.0.1:8512/logout;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /session/whoami {
    proxy_intercept_errors off;
    auth_request off;
    proxy_pass http://127.0.0.1:8512/session/whoami;
    proxy_set_header Host $host;
}

# public pages — the only ones outside the login
location = /logged-out.html { auth_request off; try_files $uri =404; }
location = /no-access.html  { auth_request off; try_files $uri =404; }
location = /favicon.ico     { auth_request off; try_files $uri =404; }
location = /favicon.svg     { auth_request off; try_files $uri =404; }

# self-service account page — any signed-in user; the app only ever
# changes the account named by X-Remote-User.
location = /account { return 301 /account/; }
location /account/ {
    proxy_pass http://127.0.0.1:8511/account/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Remote-User $argia_user;
}

location = /setup { return 301 /setup/; }
location /setup/ {
    proxy_pass http://127.0.0.1:8511/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Remote-User $argia_user;
}

# Per-area authorisation now happens in the auth service (auth_core.
# area_for_path), which mirrors the old per-location htpasswd files
# one for one.  These blocks remain only to serve the files.
location /financial/ { try_files $uri $uri/ =404; }
location /invoices/  { try_files $uri $uri/ =404; }
location /portfolio/ { try_files $uri $uri/ =404; }
location /capex/     { try_files $uri $uri/ =404; }
location /gto1/ { try_files $uri $uri/ =404; }
location /mex1/ { try_files $uri $uri/ =404; }
location /mex2/ { try_files $uri $uri/ =404; }
location /nl1/  { try_files $uri $uri/ =404; }
location /slp1/ { try_files $uri $uri/ =404; }
location /slp2/ { try_files $uri $uri/ =404; }
location /gto2/ { try_files $uri $uri/ =404; }
location /qro1/ { try_files $uri $uri/ =404; }
location /nl2/  { try_files $uri $uri/ =404; }
location /mex3/ { try_files $uri $uri/ =404; }
location /tam1/ { try_files $uri $uri/ =404; }

location /monitoring/ { try_files $uri $uri/ =404; }
# --- end ARGIA session login --------------------------------------------
