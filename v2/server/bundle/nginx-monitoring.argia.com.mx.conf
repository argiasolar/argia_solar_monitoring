# monitoring.argia.com.mx — REDIRECT ONLY (since 2026-08-28; to the
# portal since v214, 2026-09-06). Old links keep working: every path is
# 301'd to the same page under portal.argia.com.mx/monitoring/, and
# /account/ keeps its own path.

server {
    listen 80;
    listen [::]:80;
    server_name monitoring.argia.com.mx;
    include /etc/nginx/scripts/acme.conf;
    location / { return 301 https://monitoring.argia.com.mx$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitoring.argia.com.mx;

    ssl_certificate     /etc/letsencrypt/live/monitoring.argia.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.argia.com.mx/privkey.pem;

    access_log /var/log/nginx/monitoring-portal-access.log;
    error_log  /var/log/nginx/monitoring-portal-error.log notice;

    location /account/ { return 301 https://portal.argia.com.mx$request_uri; }
    location = /favicon.ico { return 301 https://portal.argia.com.mx$request_uri; }
    location = /favicon.png { return 301 https://portal.argia.com.mx$request_uri; }

    location / { return 301 https://portal.argia.com.mx/monitoring$request_uri; }
}
