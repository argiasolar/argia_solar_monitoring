# monitoring.argia.com.mx — REDIRECT ONLY (since 2026-08-28).
#
# Everything now lives on report.argia.com.mx: reports at the root,
# live monitoring under /monitoring/. Browsers cache basic-auth
# credentials per hostname, so two hostnames meant two logins and, in
# practice, no way to tell which account a page belonged to. One host
# = one login. The access rules moved with it, unchanged, into
# snippets/argia_auth.conf (fleet + PPA internal; CAPEX owners reach
# only their own plant page).
#
# Old links keep working: every path is 301'd to the same page under
# /monitoring/, and /account/ keeps its own path.

server {
    listen 80;
    listen [::]:80;
    server_name monitoring.argia.com.mx;
    include /etc/nginx/scripts/acme.conf;
    location / { return 301 https://monitoring.argia.com.mx$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitoring.argia.com.mx;

    ssl_certificate     /etc/letsencrypt/live/monitoring.argia.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.argia.com.mx/privkey.pem;

    access_log /var/log/nginx/monitoring-portal-access.log;
    error_log  /var/log/nginx/monitoring-portal-error.log notice;

    # the account page is at the root of the new host, not under
    # /monitoring/ — redirect it there directly
    location /account/ { return 301 https://report.argia.com.mx$request_uri; }
    location = /favicon.ico { return 301 https://report.argia.com.mx$request_uri; }
    location = /favicon.png { return 301 https://report.argia.com.mx$request_uri; }

    location / { return 301 https://report.argia.com.mx/monitoring$request_uri; }
}
