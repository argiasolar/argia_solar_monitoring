# monitoring.argia.com.mx — nginx vhost (source of truth: repo
# v2/server/bundle/; deploy: cp to /etc/nginx/sites-available/ then
# nginx -t && systemctl reload nginx).
#
# Access model (all htpasswd files are managed by the setup app,
# argia-level users are present in every file):
#   default            monitoring.htpasswd  — internal (PPA + fleet)
#   /capex/            capex.htpasswd       — CAPEX overview, shareable
#   /gto2/ /qro1/ /nl2/ /mex3/  per-plant   — each CAPEX owner sees
#                                             only their own plant
#   /assets/ + favicon all.htpasswd         — photos/icons load for
#                                             every authenticated user
# PPA plant pages and portfolio pages stay under monitoring.htpasswd:
# PPA data is Argia-internal and is never exposed to client accounts.

server {
    listen 80;
    listen [::]:80;
    server_name monitoring.argia.com.mx;
    include /etc/nginx/scripts/acme.conf;
    location / { return 301 https://monitoring.argia.com.mx$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitoring.argia.com.mx;
    root /www/hosting/monitoring.argia.com.mx/www/monitoring;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/monitoring.argia.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.argia.com.mx/privkey.pem;

    access_log /var/log/nginx/monitoring-portal-access.log;
    error_log  /var/log/nginx/monitoring-portal-error.log notice;
    add_header X-Content-Type-Options nosniff;
    add_header Cache-Control "no-cache, must-revalidate" always;

    auth_basic "ARGIA monitoring";
    auth_basic_user_file /opt/argia/auth/monitoring.htpasswd;

    # ---- shared static bits: any authenticated user ----
    location /assets/ {
        auth_basic_user_file /opt/argia/auth/all.htpasswd;
        try_files $uri =404;
    }
    location = /favicon.png {
        auth_basic_user_file /opt/argia/auth/all.htpasswd;
        try_files $uri =404;
    }
    location = /favicon.ico {
        auth_basic_user_file /opt/argia/auth/all.htpasswd;
        try_files $uri =404;
    }

    # ---- CAPEX portfolio: shareable with CAPEX plant owners ----
    location /capex/ {
        auth_basic_user_file /opt/argia/auth/capex.htpasswd;
        try_files $uri $uri/ =404;
    }
    location /gto2/ {
        auth_basic_user_file /opt/argia/auth/gto2.htpasswd;
        try_files $uri $uri/ =404;
    }
    location /qro1/ {
        auth_basic_user_file /opt/argia/auth/qro1.htpasswd;
        try_files $uri $uri/ =404;
    }
    location /nl2/ {
        auth_basic_user_file /opt/argia/auth/nl2.htpasswd;
        try_files $uri $uri/ =404;
    }
    location /mex3/ {
        auth_basic_user_file /opt/argia/auth/mex3.htpasswd;
        try_files $uri $uri/ =404;
    }

    # everything else (fleet, PPA plants, performance, recon, invoices)
    # stays Argia-internal under monitoring.htpasswd
    location / { try_files $uri $uri/ =404; }
}
