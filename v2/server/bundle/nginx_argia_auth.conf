# --- ARGIA reporting: per-area access control ---------------------------
# Managed by /opt/argia/bundle/setup_app.py via https://<host>/setup/ .
# Default: any valid user (all.htpasswd) sees the landing page; each report
# area below requires membership in its own htpasswd file. Files are
# regenerated by the setup app; nginx re-reads them per request (no reload).

add_header Cache-Control "no-cache, must-revalidate" always;
auth_basic "ARGIA reporting";
auth_basic_user_file /opt/argia/auth/all.htpasswd;

# logout landing page — the ONLY unauthenticated path
location = /logged-out.html { auth_basic off; try_files $uri =404; }

location = /setup { return 301 /setup/; }
location /setup/ {
    auth_basic "ARGIA setup";
    auth_basic_user_file /opt/argia/auth/admin.htpasswd;
    proxy_pass http://127.0.0.1:8511/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Remote-User $remote_user;
}

location /financial/ { auth_basic "ARGIA reporting"; auth_basic_user_file /opt/argia/auth/financial.htpasswd; try_files $uri $uri/ =404; }
location /capex/     { auth_basic "ARGIA reporting"; auth_basic_user_file /opt/argia/auth/capex.htpasswd;     try_files $uri $uri/ =404; }
location /gto1/ { auth_basic "ARGIA reporting"; auth_basic_user_file /opt/argia/auth/gto1.htpasswd; try_files $uri $uri/ =404; }
location /mex1/ { auth_basic "ARGIA reporting"; auth_basic_user_file /opt/argia/auth/mex1.htpasswd; try_files $uri $uri/ =404; }
location /mex2/ { auth_basic "ARGIA reporting"; auth_basic_user_file /opt/argia/auth/mex2.htpasswd; try_files $uri $uri/ =404; }
location /nl1/  { auth_basic "ARGIA reporting"; auth_basic_user_file /opt/argia/auth/nl1.htpasswd;  try_files $uri $uri/ =404; }
location /slp1/ { auth_basic "ARGIA reporting"; auth_basic_user_file /opt/argia/auth/slp1.htpasswd; try_files $uri $uri/ =404; }
location /slp2/ { auth_basic "ARGIA reporting"; auth_basic_user_file /opt/argia/auth/slp2.htpasswd; try_files $uri $uri/ =404; }
location /gto2/ { auth_basic "ARGIA reporting"; auth_basic_user_file /opt/argia/auth/gto2.htpasswd; try_files $uri $uri/ =404; }
location /qro1/ { auth_basic "ARGIA reporting"; auth_basic_user_file /opt/argia/auth/qro1.htpasswd; try_files $uri $uri/ =404; }
location /nl2/  { auth_basic "ARGIA reporting"; auth_basic_user_file /opt/argia/auth/nl2.htpasswd;  try_files $uri $uri/ =404; }
location /mex3/ { auth_basic "ARGIA reporting"; auth_basic_user_file /opt/argia/auth/mex3.htpasswd; try_files $uri $uri/ =404; }
# --- end ARGIA reporting access control ---------------------------------
