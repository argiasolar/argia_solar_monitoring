# portal.argia.com.mx — the new portal (v208), generated by
# /opt/argia/bundle/portal_gen.py into its own web root, served beside
# report.argia.com.mx with the SAME session and grants (argia_auth
# snippet -> auth_app on 127.0.0.1:8512; areas in auth_core.PREFIX_AREA).
server {
    listen 80;
    listen [::]:80;
    server_name portal.argia.com.mx;
    include /etc/nginx/scripts/acme.conf;
    location / { return 301 https://portal.argia.com.mx$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.argia.com.mx;
    root /www/hosting/portal.argia.com.mx/www;
    index index.html;
    charset utf-8;      # v242 (Mirek): text/html and text/csv say their encoding in the header, not only in <meta>
    charset_types text/css text/plain text/csv application/json text/xml;
    ssl_certificate     /etc/letsencrypt/live/portal.argia.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.argia.com.mx/privkey.pem;
    access_log /var/log/nginx/portal.argia.com.mx-access.log;
    error_log  /var/log/nginx/portal.argia.com.mx-error.log notice;
    # v218 security headers (nginx add_header is per level: these sit at
    # server level and the auth snippet adds Cache-Control at the same
    # level, so every location inherits all of them)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/argia_auth.conf;
    location = /favicon.png { auth_request off; try_files $uri =404; }
    location /assets/ { expires 1d; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
