# portal.argia.com.mx — BOOTSTRAP vhost (HTTP only) used until the
# Let's Encrypt certificate exists:
#   certbot certonly --webroot -w /www/hosting/portal.argia.com.mx/www -d portal.argia.com.mx
# then install portal.argia.com.mx.conf in its place. (v208)
server {
    listen 80;
    listen [::]:80;
    server_name portal.argia.com.mx;
    root /www/hosting/portal.argia.com.mx/www;
    include /etc/nginx/scripts/acme.conf;
    location / { return 503; }
}
