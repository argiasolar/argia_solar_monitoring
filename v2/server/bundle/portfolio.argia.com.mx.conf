# portfolio.argia.com.mx — REDIRECT ONLY (v177, 2026-09-02).
#
# The map lives at https://report.argia.com.mx/portfolio/ — one host,
# one login (the 2026-08-28 lesson: browsers cache credentials per
# hostname, a second hostname means a second sign-in and confusion
# about which account a page belongs to). This vhost only makes the
# pretty name work.
#
# TO ACTIVATE (needs Tomasz):
#   1. DNS (GoDaddy zone argia.com.mx): A portfolio -> 37.235.105.173
#   2. then on pio06:
#      certbot certonly --webroot -w /www/hosting/monitoring.argia.com.mx/www \
#        -d portfolio.argia.com.mx
#      (uncomment the 443 block below, fix the cert paths certbot
#       printed, then: nginx -t && systemctl reload nginx)
# Until DNS exists this file serves nothing and breaks nothing.

server {
    listen 80;
    listen [::]:80;
    server_name portfolio.argia.com.mx;
    include /etc/nginx/scripts/acme.conf;
    location / { return 301 https://report.argia.com.mx/portfolio/; }
}

