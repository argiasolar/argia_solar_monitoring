# prologis.argia.com.mx (v292) - ARGIA for Prologis, a SEPARATE customer
# platform: everything is proxied to prologis_app.py on 127.0.0.1:8520,
# which does its own login (password + TOTP), roles, CSRF, audit log and
# security headers (CSP). No ARGIA portal snippet, no portal session, no
# shared files: portal accounts do not exist here and vice versa.
limit_req_zone $binary_remote_addr zone=pl_login:10m rate=10r/m;
server {
    listen 80;
    listen [::]:80;
    server_name prologis.argia.com.mx;
    include /etc/nginx/scripts/acme.conf;
    location / { return 301 https://prologis.argia.com.mx$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prologis.argia.com.mx;
    ssl_certificate     /etc/letsencrypt/live/prologis.argia.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prologis.argia.com.mx/privkey.pem;
    # v324: own folder, rotated by /etc/logrotate.d/argia-prologis and kept 12 months
    access_log /var/log/argia-prologis/access.log;
    error_log  /var/log/argia-prologis/error.log notice;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 52m;
    location = /login {
        limit_req zone=pl_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8520;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # v333 (Tomasz, 28 Oct): the product manual (/about) is for invited readers
    # only - HTTP Basic with its own user file, nothing to do with the
    # platform login. A file without users = nobody gets in (401).
    # Add or change a reader (asks for the password twice):
    #   printf '%s:%s\n' NAME "$(openssl passwd -apr1)" >> /opt/argia/prologis_about.htpasswd
    location ~ ^/about/?$ {
        limit_req zone=pl_login burst=5 nodelay;
        auth_basic "ARGIA product manual";
        auth_basic_user_file /opt/argia/prologis_about.htpasswd;
        proxy_pass http://127.0.0.1:8520;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8520;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
