# prologis.argia.com.mx - BOOTSTRAP vhost (HTTP only) used until the
# Let's Encrypt certificate exists:
#   certbot certonly --webroot -w /www/hosting/vas-server.cz/acme -d prologis.argia.com.mx
# (the box's shared ACME root - acme.conf serves /.well-known/ from there)
# then install prologis.argia.com.mx.conf in its place. (v292)
server {
    listen 80;
    listen [::]:80;
    server_name prologis.argia.com.mx;
    include /etc/nginx/scripts/acme.conf;
    location / { return 503; }
}
