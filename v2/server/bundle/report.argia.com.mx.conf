# report.argia.com.mx — REDIRECT ONLY (v214, 2026-09-06).
#
# The old site is decommissioned: everything lives on portal.argia.com.mx
# (same login, same grants, one implementation per page). Old bookmarks
# and mails keep working — every old path 301s to its portal page:
#   /                    -> /report/            (the report home)
#   /financial/ /capex/  -> /report/financial/  /report/capex/
#   /<code>/             -> /report/<code>/     (-> the customer-name page)
#   /monitoring/...      -> /monitoring/...     (same paths, live pages)
#   /portfolio/          -> /map/
#   /cfe/                -> /setup/cfe/         (open to every signed-in user)
#   /invoices/... /setup/... /ask/... /account/... /login /logout -> same paths
# The certificate stays (auto-renew via the shared ACME webroot) so the
# redirects are served over HTTPS.

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name report.argia.com.mx;

    include /etc/nginx/scripts/acme.conf;

    ssl_certificate     /etc/letsencrypt/live/report.argia.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/report.argia.com.mx/privkey.pem;

    access_log /var/log/nginx/report.argia.com.mx-access.log;
    error_log  /var/log/nginx/report.argia.com.mx-error.log notice;

    location = /              { return 301 https://portal.argia.com.mx/report/; }
    location /financial/      { return 301 https://portal.argia.com.mx/report$request_uri; }
    location /capex/          { return 301 https://portal.argia.com.mx/report$request_uri; }
    location /portfolio/      { return 301 https://portal.argia.com.mx/map/; }
    location /cfe/            { return 301 https://portal.argia.com.mx/setup/cfe/; }
    location ~ ^/(gto1|gto2|mex1|mex2|mex3|nl1|nl2|qro1|slp1|slp2|tam1)/ {
                                return 301 https://portal.argia.com.mx/report$request_uri; }
    location /                { return 301 https://portal.argia.com.mx$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^(?<sub>financial|setup|capex|gto1|mex1|mex2|nl1|slp1|slp2|gto2|qro1|nl2|mex3)\.report\.argia\.com\.mx$;

    include /etc/nginx/scripts/acme.conf;

    ssl_certificate     /etc/letsencrypt/live/report.argia.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/report.argia.com.mx/privkey.pem;

    return 301 https://report.argia.com.mx/$sub/$request_uri;
}
