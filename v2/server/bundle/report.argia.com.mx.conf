# ARGIA reporting under its final names. NOT ENABLED until DNS + certs exist.
# Enable with: /opt/argia/enable_report_domains.sh  (runs certbot, links, reloads)
#
# DNS needed first (GoDaddy zone argia.com.mx):
#   A  report              -> 37.235.105.173
#   A  *.report            -> 37.235.105.173
#
# report.argia.com.mx serves the same tree as monitoring.argia.com.mx;
# the pretty subdomains 301-redirect into their paths so every relative
# link and the shared per-area auth keep working in one place.

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name report.argia.com.mx;
    root /www/hosting/monitoring.argia.com.mx/www;
    index index.html;

    include /etc/nginx/scripts/acme.conf;

    ssl_certificate     /etc/letsencrypt/live/report.argia.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/report.argia.com.mx/privkey.pem;

    access_log /var/log/nginx/report.argia.com.mx-access.log;
    error_log  /var/log/nginx/report.argia.com.mx-error.log notice;
    add_header X-Content-Type-Options nosniff;

    include /etc/nginx/snippets/argia_auth.conf;

    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^(?<sub>financial|setup|capex|gto1|mex1|mex2|nl1|slp1|slp2|gto2|qro1|nl2|mex3)\.report\.argia\.com\.mx$;

    include /etc/nginx/scripts/acme.conf;

    ssl_certificate     /etc/letsencrypt/live/report.argia.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/report.argia.com.mx/privkey.pem;

    return 301 https://report.argia.com.mx/$sub/$request_uri;
}
